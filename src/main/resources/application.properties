# Server
server.port=8080
spring.application.name=rate-limiter

# Redis (we'll use this in Stage 2, define now)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Actuator - expose all endpoints for monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Rate Limit Config (custom properties)
rate.limit.default.requests=10
rate.limit.default.window=60
rate.limit.free.requests=10
rate.limit.pro.requests=100
rate.limit.admin.requests=1000